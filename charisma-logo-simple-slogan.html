<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شعار كاريزما - نسخة شفافة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap');
    :root {
      --red: #ef3d2f;
      --yellow: #ffc928;
      --ink: #171717;
      --paper: #fff8eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: Cairo, Arial, sans-serif;
      background-color: #f4f1ea;
      background-image:
        linear-gradient(45deg, rgba(23,23,23,.06) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(23,23,23,.06) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(23,23,23,.06) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(23,23,23,.06) 75%);
      background-size: 30px 30px;
      background-position: 0 0, 0 15px, 15px -15px, -15px 0;
    }
    .logo-lockup {
      display: flex;
      align-items: center;
      gap: clamp(18px, 4vw, 38px);
      direction: ltr;
      max-width: 100%;
    }
    .emblem {
      width: clamp(132px, 22vw, 220px);
      height: clamp(132px, 22vw, 220px);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--red);
      border: clamp(8px, 1.2vw, 12px) solid var(--ink);
      box-shadow: clamp(9px, 1.4vw, 14px) clamp(10px, 1.6vw, 16px) 0 var(--yellow);
      transform: rotate(-6deg);
      position: relative;
    }
    .emblem:before,
    .emblem:after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      height: clamp(11px, 1.8vw, 18px);
      border-radius: 999px;
      background: var(--yellow);
      box-shadow: 0 5px 0 rgba(23,23,23,.22);
    }
    .emblem:before { top: 21%; }
    .emblem:after { bottom: 21%; }
    .emblem-letter {
      color: var(--paper);
      font-size: clamp(70px, 11vw, 112px);
      line-height: 1;
      font-weight: 900;
      transform: translateY(3px);
      text-shadow: 5px 6px 0 rgba(23,23,23,.23);
    }
    .wordmark {
      color: var(--ink);
      font-size: clamp(55px, 11vw, 138px);
      line-height: .9;
      letter-spacing: -.1em;
      font-weight: 900;
      white-space: nowrap;
      text-shadow: 5px 6px 0 var(--yellow);
    }
    .tagline {
      color: var(--red);
      font-size: clamp(18px, 2.4vw, 27px);
      line-height: 1.2;
      letter-spacing: .03em;
      font-weight: 800;
      margin-top: 20px;
      padding-right: 8px;
      text-align: center;
    }
    .note {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      color: #71695f;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    @media (max-width: 650px) {
      body { padding: 22px 14px 60px; }
      .logo-lockup { flex-direction: column; gap: 24px; }
      .tagline { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <main class="logo-lockup" aria-label="شعار مطعم كاريزما">
    <div class="emblem" aria-hidden="true">
      <span class="emblem-letter">ك</span>
    </div>
    <div>
      <div class="wordmark">كاريزما</div>
      <div class="tagline">محدش قدك</div>
    </div>
  </main>
  <div class="note">المربعات للمعاينة فقط، التصميم نفسه بدون خلفية</div>
</body>
</html>
