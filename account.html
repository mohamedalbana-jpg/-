<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حسابي | كاريزما</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap');
    :root { --ink:#171717; --muted:#71695f; --paper:#f7f3eb; --card:#fffdf8; --red:#ef3d2f; --yellow:#ffc928; --green:#2f7d58; --line:rgba(23,23,23,.12); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 8% 8%,rgba(255,201,40,.25),transparent 25rem),radial-gradient(circle at 92% 18%,rgba(47,125,88,.16),transparent 24rem),var(--paper); font-family:Cairo,Arial,sans-serif; }
    .page { width:min(520px,100%); margin:auto; padding:18px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0 24px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .mark { width:44px; height:44px; display:grid; place-items:center; color:var(--paper); background:var(--red); border:3px solid var(--ink); border-radius:50%; box-shadow:4px 4px 0 var(--yellow); font-size:22px; font-weight:900; }
    .brand strong { display:block; font-size:20px; line-height:1; }
    .brand small { color:var(--muted); font-size:10px; font-weight:800; }
    .back { padding:9px 13px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:11px; font:inherit; font-weight:900; text-decoration:none; }
    .card { padding:24px; border:2px solid var(--ink); border-radius:24px; background:var(--card); box-shadow:8px 8px 0 var(--yellow); }
    .eyebrow { color:var(--green); font-size:12px; font-weight:900; }
    h1 { margin:5px 0 7px; font-size:clamp(30px,7vw,46px); letter-spacing:-.07em; }
    .intro, .helper { color:var(--muted); font-size:12px; font-weight:800; line-height:1.8; }
    .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:18px 0; }
    .tabs button { padding:10px 6px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:#f0ece4; font:inherit; font-size:11px; font-weight:900; cursor:pointer; }
    .tabs button.active { color:var(--paper); background:var(--ink); }
    .form { display:grid; gap:9px; }
    .form[hidden], .panel[hidden] { display:none; }
    label { font-size:11px; font-weight:900; }
    input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; }
    input:focus { outline:3px solid rgba(47,125,88,.2); border-color:var(--green); }
    .primary { margin-top:5px; padding:12px 14px; border:0; border-radius:11px; color:var(--paper); background:var(--red); font:inherit; font-weight:900; cursor:pointer; }
    .secondary { padding:10px 14px; border:0; border-radius:11px; color:var(--ink); background:#f0ece4; font:inherit; font-weight:900; cursor:pointer; }
    .actions { display:flex; gap:8px; margin-top:6px; }
    .message { min-height:22px; margin-top:12px; color:var(--green); font-size:12px; font-weight:900; line-height:1.7; }
    .message.error { color:var(--red); }
    .code-box { margin-top:12px; padding:12px; border:1px dashed var(--green); border-radius:12px; background:#e8f3e8; color:var(--green); font-size:12px; font-weight:900; }
    .status { margin-top:18px; padding-top:14px; border-top:1px dashed var(--line); }
    .status strong { color:var(--green); }
    @media (max-width:430px) { .card { padding:20px 16px; } .tabs button { font-size:10px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><div class="brand"><div class="mark">ك</div><div><strong>كاريزما</strong><small>حسابك ونقاطك</small></div></div><div><a class="back" href="support.html">الدعم</a> <a class="back" href="index.html">رجوع للمنيو</a></div></header>
    <section class="card">
      <div class="eyebrow">حساب واحد لطلباتك ومكافآتك</div>
      <h1 id="title">ادخل حسابك</h1>
      <p class="intro">استخدم الإيميل أو رقم الهاتف. في النسخة التجارية سيصل كود التفعيل برسالة حقيقية، أما الديمو فيعرضه لك على الصفحة.</p>
      <nav class="tabs" aria-label="خيارات الحساب">
        <button class="active" data-panel="loginPanel">دخول</button>
        <button data-panel="registerPanel">حساب جديد</button>
        <button data-panel="resetPanel">نسيت كلمة السر</button>
      </nav>
      <section class="panel" id="loginPanel">
        <form class="form" id="loginForm">
          <label for="loginIdentifier">الإيميل أو رقم الهاتف</label>
          <input id="loginIdentifier" required autocomplete="username">
          <label for="loginPassword">كلمة السر</label>
          <input id="loginPassword" type="password" required autocomplete="current-password">
          <button class="primary" type="submit">دخول</button>
        </form>
      </section>
      <section class="panel" id="registerPanel" hidden>
        <form class="form" id="registerForm">
          <label for="registerName">الاسم</label>
          <input id="registerName" required autocomplete="name">
          <label for="registerIdentifier">الإيميل أو رقم الهاتف</label>
          <input id="registerIdentifier" required autocomplete="username">
          <label for="registerPassword">كلمة السر</label>
          <input id="registerPassword" type="password" minlength="8" required autocomplete="new-password">
          <label for="registerPasswordAgain">تأكيد كلمة السر</label>
          <input id="registerPasswordAgain" type="password" minlength="8" required autocomplete="new-password">
          <button class="primary" type="submit">إنشاء الحساب وإرسال الكود</button>
        </form>
      </section>
      <section class="panel" id="resetPanel" hidden>
        <form class="form" id="resetForm">
          <label for="resetIdentifier">الإيميل أو رقم الهاتف</label>
          <input id="resetIdentifier" required autocomplete="username">
          <button class="primary" type="submit">إرسال كود استرجاع</button>
        </form>
      </section>
      <section class="panel" id="verifyPanel" hidden>
        <form class="form" id="verifyForm">
          <label for="verificationCode">كود التفعيل</label>
          <input id="verificationCode" inputmode="numeric" maxlength="6" required autocomplete="one-time-code">
          <div id="newPasswordWrap" hidden>
            <label for="newPassword">كلمة السر الجديدة</label>
            <input id="newPassword" type="password" minlength="8" autocomplete="new-password">
          </div>
          <button class="primary" type="submit">تفعيل الحساب</button>
        </form>
        <div class="code-box" id="demoCode" hidden></div>
      </section>
      <div class="message" id="message" role="status"></div>
      <div class="status" id="accountStatus"></div>
    </section>
  </main>
  <script>
    const accountKey = 'charisma-account';
    const pendingKey = 'charisma-pending-account';
    const $ = id => document.getElementById(id);
    let resetMode = false;
    const normalize = value => String(value || '').trim().toLowerCase();
    const makeCode = () => String(Math.floor(100000 + Math.random() * 900000));
    async function digest(value) {
      const bytes = new TextEncoder().encode(value);
      const hash = await crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(hash)].map(byte => byte.toString(16).padStart(2, '0')).join('');
    }
    function showMessage(text, error = false) { $('message').textContent = text; $('message').classList.toggle('error', error); }
    function showStatus() {
      const account = JSON.parse(localStorage.getItem(accountKey) || 'null');
      $('accountStatus').innerHTML = account ? `الحساب الحالي: <strong>${account.name}</strong><br>الرصيد: <strong>${Number(account.points || 0)} نقطة أثر</strong>` : 'لسه مفيش حساب متفعل على هذا الجهاز.';
    }
    document.querySelectorAll('[data-panel]').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('[data-panel]').forEach(item => item.classList.toggle('active', item === tab));
      document.querySelectorAll('.panel').forEach(panel => panel.hidden = panel.id !== tab.dataset.panel);
      $('title').textContent = tab.dataset.panel === 'registerPanel' ? 'اعمل حساب جديد' : tab.dataset.panel === 'resetPanel' ? 'استرجع كلمة السر' : 'ادخل حسابك';
      showMessage('');
    }));
    $('registerForm').addEventListener('submit', async event => {
      event.preventDefault();
      const name = $('registerName').value.trim();
      const identifier = normalize($('registerIdentifier').value);
      const password = $('registerPassword').value;
      if (password !== $('registerPasswordAgain').value) return showMessage('كلمتا السر غير متطابقتين.', true);
      if (localStorage.getItem(accountKey)) return showMessage('يوجد حساب متفعل بالفعل على هذا الجهاز. استخدم الدخول أو الاسترجاع.', true);
      const code = makeCode();
      const pending = { name, identifier, passwordDigest: await digest(password), points: 0, verificationCode: code };
      localStorage.setItem(pendingKey, JSON.stringify(pending));
      $('registerPanel').hidden = true;
      $('verifyPanel').hidden = false;
      $('demoCode').hidden = false;
      $('demoCode').textContent = `كود التفعيل التجريبي: ${code}`;
      showMessage('تم إنشاء طلب الحساب. ادخل كود التفعيل لإكمال التسجيل.');
    });
    $('verifyForm').addEventListener('submit', event => {
      event.preventDefault();
      if (resetMode) {
        const account = JSON.parse(localStorage.getItem(accountKey) || 'null');
        const code = localStorage.getItem('charisma-reset-code');
        const password = $('newPassword').value;
        if (!account || $('verificationCode').value.trim() !== code) return showMessage('كود الاسترجاع غير صحيح.', true);
        if (password.length < 8) return showMessage('كلمة السر الجديدة يجب أن تكون 8 أحرف على الأقل.', true);
        digest(password).then(passwordDigest => {
          account.passwordDigest = passwordDigest;
          localStorage.setItem(accountKey, JSON.stringify(account));
          localStorage.removeItem('charisma-reset-code');
          resetMode = false;
          $('newPasswordWrap').hidden = true;
          $('verifyPanel').hidden = true;
          $('loginPanel').hidden = false;
          showStatus();
          showMessage('تم تغيير كلمة السر. يمكنك تسجيل الدخول الآن.');
        });
        return;
      }
      const pending = JSON.parse(localStorage.getItem(pendingKey) || 'null');
      if (!pending || $('verificationCode').value.trim() !== pending.verificationCode) return showMessage('كود التفعيل غير صحيح.', true);
      const account = { name: pending.name, email: pending.identifier.includes('@') ? pending.identifier : '', phone: pending.identifier.includes('@') ? '' : pending.identifier, passwordDigest: pending.passwordDigest, points: pending.points, verified: true, rewards: [] };
      localStorage.setItem(accountKey, JSON.stringify(account));
      localStorage.removeItem(pendingKey);
      showStatus();
      showMessage('تم تفعيل الحساب وتسجيل الدخول. نقاط الأثر ستتجمع عليه.');
      $('verifyPanel').hidden = true;
      $('loginPanel').hidden = false;
    });
    $('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const account = JSON.parse(localStorage.getItem(accountKey) || 'null');
      if (!account || normalize($('loginIdentifier').value) !== normalize(account.email || account.phone) || await digest($('loginPassword').value) !== account.passwordDigest) return showMessage('بيانات الدخول غير صحيحة.', true);
      showStatus();
      showMessage(`أهلًا ${account.name}. تم تسجيل الدخول.`);
    });
    $('resetForm').addEventListener('submit', event => {
      event.preventDefault();
      const account = JSON.parse(localStorage.getItem(accountKey) || 'null');
      if (!account || normalize($('resetIdentifier').value) !== normalize(account.email || account.phone)) return showMessage('لم نجد حسابًا بهذا الإيميل أو الرقم على هذا الجهاز.', true);
      const code = makeCode();
      localStorage.setItem('charisma-reset-code', code);
      resetMode = true;
      $('loginPanel').hidden = true;
      $('resetPanel').hidden = true;
      $('verifyPanel').hidden = false;
      $('newPasswordWrap').hidden = false;
      $('title').textContent = 'غيّر كلمة السر';
      $('demoCode').hidden = false;
      $('demoCode').textContent = `كود الاسترجاع التجريبي: ${code}. في النسخة التجارية سيصل برسالة.`;
      showMessage('تم تجهيز كود الاسترجاع. اكتب الكود وكلمة السر الجديدة.');
    });
    showStatus();
  </script>
</body>
</html>
