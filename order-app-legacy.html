<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كاريزما | اطلب أكلك</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap');
    :root {
      --red: #ef3d2f;
      --yellow: #ffc928;
      --ink: #171717;
      --paper: #fff8eb;
      --muted: #71695f;
      --line: rgba(23, 23, 23, .11);
      --shadow: 0 18px 45px rgba(23, 23, 23, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      background: #f5f1e9;
      font-family: Cairo, Arial, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    .app-shell { min-height: 100dvh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px clamp(18px, 5vw, 72px);
      background: rgba(245, 241, 233, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
      font-weight: 900;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--paper);
      background: var(--red);
      border: 4px solid var(--ink);
      box-shadow: 5px 6px 0 var(--yellow);
      transform: rotate(-6deg);
      font-size: 24px;
    }
    .brand-name { font-size: 22px; line-height: 1; }
    .brand-name small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .location {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .location strong { color: var(--ink); }
    .cart-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      color: var(--paper);
      background: var(--ink);
      border: 0;
      border-radius: 999px;
      font-weight: 900;
    }
    .cart-count {
      min-width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--yellow);
      border-radius: 50%;
      font-size: 12px;
    }
    .main {
      width: min(1320px, 100%);
      margin: 0 auto;
      padding: 34px clamp(18px, 5vw, 72px) 90px;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: clamp(26px, 6vw, 88px);
      align-items: center;
      padding: 22px 0 42px;
    }
    .hero h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(42px, 7vw, 82px);
      line-height: .98;
      letter-spacing: -.06em;
    }
    .hero h1 span { color: var(--red); }
    .hero p {
      max-width: 470px;
      margin: 18px 0 0;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.8;
    }
    .hero-visual {
      min-height: 280px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: var(--red);
      box-shadow: var(--shadow);
      transform: rotate(2deg);
    }
    .hero-visual::before,
    .hero-visual::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 28px solid var(--yellow);
      opacity: .8;
    }
    .hero-visual::before { width: 210px; height: 210px; top: -110px; left: -70px; }
    .hero-visual::after { width: 160px; height: 160px; right: -80px; bottom: -90px; border-color: var(--paper); }
    .hero-food {
      width: min(72%, 390px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
      border-radius: 50%;
      color: var(--ink);
      background: var(--yellow);
      border: 14px solid var(--ink);
      font-size: clamp(90px, 15vw, 170px);
      filter: drop-shadow(0 18px 0 rgba(23, 23, 23, .2));
    }
    .hero-food::after { content: "وجبتك مستنياك"; position: absolute; bottom: 24px; font-size: 15px; font-weight: 900; }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .section-heading h2 { margin: 0; font-size: clamp(25px, 4vw, 40px); letter-spacing: -.04em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0 16px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .category {
      flex: 0 0 auto;
      padding: 10px 17px;
      color: var(--ink);
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-weight: 900;
    }
    .category.active { color: var(--ink); background: var(--yellow); border-color: var(--yellow); }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .food-card {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      overflow: hidden;
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 10px 26px rgba(23, 23, 23, .05);
    }
    .food-image {
      min-height: 170px;
      display: grid;
      place-items: center;
      position: relative;
      background: #ffd84c;
      font-size: 84px;
    }
    .food-card:nth-child(2n) .food-image { background: #f7c4a8; }
    .food-card:nth-child(3n) .food-image { background: #c7dfb0; }
    .food-image span {
      display: block;
      transform: rotate(-5deg);
      filter: drop-shadow(0 8px 0 rgba(23, 23, 23, .12));
    }
    .food-info { display: flex; flex: 1; flex-direction: column; padding: 16px; }
    .food-info h3 { margin: 0; font-size: 20px; }
    .food-info p { min-height: 44px; margin: 7px 0 15px; color: var(--muted); font-size: 13px; line-height: 1.7; font-weight: 700; }
    .food-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
    .price { color: var(--red); font-size: 20px; font-weight: 900; }
    .add-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      color: var(--ink);
      background: var(--yellow);
      border: 0;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
    }
    .cart-drawer {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 10;
      width: min(430px, 100%);
      display: flex;
      flex-direction: column;
      padding: 24px;
      background: #fffdf8;
      box-shadow: -20px 0 60px rgba(23, 23, 23, .16);
      transform: translateX(105%);
      transition: transform .35s cubic-bezier(.16, 1, .3, 1);
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .cart-head h2 { margin: 0; font-size: 25px; }
    .close-button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: #f0ece4; font-weight: 900; }
    .cart-items { flex: 1; overflow: auto; padding: 16px 0; }
    .cart-item { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .cart-item-icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 15px; background: var(--yellow); font-size: 28px; }
    .cart-item strong { display: block; font-size: 14px; }
    .cart-item small { color: var(--muted); font-weight: 800; }
    .cart-item b { color: var(--red); white-space: nowrap; }
    .cart-empty { margin: 70px 0; color: var(--muted); text-align: center; font-weight: 800; }
    .cart-summary { padding-top: 18px; border-top: 1px solid var(--line); }
    .summary-line { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 10px; font-weight: 800; }
    .summary-line.total { margin-top: 15px; color: var(--red); font-size: 22px; }
    .checkout { width: 100%; margin-top: 14px; padding: 14px; color: var(--paper); background: var(--red); border: 0; border-radius: 14px; font-weight: 900; }
    .scrim { position: fixed; inset: 0; z-index: 9; background: rgba(23, 23, 23, .42); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 20; padding: 12px 16px; color: var(--paper); background: var(--ink); border-radius: 12px; font-weight: 800; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .hero-visual { min-height: 240px; }
      .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .topbar { padding: 12px 16px; }
      .location { display: none; }
      .main { padding: 24px 16px 80px; }
      .hero { padding-top: 10px; }
      .hero h1 { font-size: 46px; }
      .hero-visual { min-height: 220px; }
      .menu-grid { grid-template-columns: 1fr; }
      .section-heading { align-items: start; flex-direction: column; gap: 4px; }
      .toast { right: 16px; bottom: 16px; left: 16px; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">ك</div>
        <div class="brand-name">كاريزما<small>محدش قدك</small></div>
      </div>
      <div class="location">التوصيل إلى <strong>المنصورة</strong>⌄</div>
      <button class="cart-button" id="openCart">السلة <span class="cart-count" id="cartCount">0</span></button>
    </header>

    <main class="main">
      <section class="hero">
        <div>
          <h1>جعان؟<br><span>خليها كاريزما.</span></h1>
          <p>اختار أكلك، ظبط طلبك، وخليه يوصلك سخن لحد بابك.</p>
        </div>
        <div class="hero-visual" aria-label="عرض وجبة برجر">
          <div class="hero-food">🍔</div>
        </div>
      </section>

      <section aria-labelledby="menuTitle">
        <div class="section-heading">
          <h2 id="menuTitle">اختار اللي على مزاجك</h2>
          <p>أسعار تجريبية للنموذج الأولي</p>
        </div>
        <div class="categories" id="categories">
          <button class="category active" data-category="all">الكل</button>
          <button class="category" data-category="burger">برجر</button>
          <button class="category" data-category="chicken">فراخ</button>
          <button class="category" data-category="sides">جانبي</button>
          <button class="category" data-category="drinks">مشروبات</button>
        </div>
        <div class="menu-grid" id="menuGrid"></div>
      </section>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="سلة الطلب">
    <div class="cart-head"><h2>طلبك</h2><button class="close-button" id="closeCart" aria-label="إغلاق السلة">×</button></div>
    <div class="cart-items" id="cartItems"><div class="cart-empty">السلة لسه فاضية<br>اختار حاجة تحبها</div></div>
    <div class="cart-summary">
      <div class="summary-line"><span>المجموع</span><span id="subtotal">0 ج.م</span></div>
      <div class="summary-line"><span>التوصيل</span><span id="delivery">-</span></div>
      <div class="summary-line total"><span>الإجمالي</span><span id="total">0 ج.م</span></div>
      <button class="checkout" id="checkout">كمل الطلب</button>
    </div>
  </aside>
  <div class="toast" id="toast"></div>

  <script>
    const menu = [
      { id: 1, category: 'burger', icon: '🍔', name: 'كاريزما كلاسيك', description: 'برجر لحمة، جبنة، خس، طماطم وصوص كاريزما.', price: 95 },
      { id: 2, category: 'burger', icon: '🍔', name: 'دبل كاريزما', description: 'قطعتين لحمة مع جبنة شيدر وصوص مدخن.', price: 135 },
      { id: 3, category: 'chicken', icon: '🍗', name: 'كرانشي تشيكن', description: 'فراخ مقرمشة، خس، مخلل وصوص حار.', price: 88 },
      { id: 4, category: 'chicken', icon: '🌯', name: 'راب كاريزما', description: 'تشيكن، جبنة، بطاطس وصوص خاص في عيش طازة.', price: 78 },
      { id: 5, category: 'sides', icon: '🍟', name: 'فرايز تشيدر', description: 'بطاطس مقرمشة مع تشيدر وصوص كاريزما.', price: 52 },
      { id: 6, category: 'sides', icon: '🧅', name: 'أونيون رينجز', description: 'حلقات بصل مقرمشة بخلطة البيت.', price: 45 },
      { id: 7, category: 'drinks', icon: '🥤', name: 'كولا ساقعة', description: 'مشروب غازي بارد.', price: 25 },
      { id: 8, category: 'drinks', icon: '🍋', name: 'ليمون بالنعناع', description: 'ليمون فريش ونعناع.', price: 38 }
    ];
    const cart = new Map();
    const menuGrid = document.getElementById('menuGrid');
    const cartDrawer = document.getElementById('cartDrawer');
    const scrim = document.getElementById('scrim');
    const toast = document.getElementById('toast');

    function renderMenu(category = 'all') {
      menuGrid.innerHTML = menu.filter(item => category === 'all' || item.category === category).map(item => `
        <article class="food-card">
          <div class="food-image"><span>${item.icon}</span></div>
          <div class="food-info">
            <h3>${item.name}</h3>
            <p>${item.description}</p>
            <div class="food-bottom">
              <span class="price">${item.price} ج.م</span>
              <button class="add-button" data-add="${item.id}">+ أضف للسلة</button>
            </div>
          </div>
        </article>`).join('');
      menuGrid.querySelectorAll('[data-add]').forEach(button => button.addEventListener('click', () => addToCart(Number(button.dataset.add))));
    }
    function addToCart(id) {
      cart.set(id, (cart.get(id) || 0) + 1);
      renderCart();
      showToast('اتضاف للسلة');
    }
    function renderCart() {
      const entries = [...cart.entries()];
      const count = entries.reduce((sum, [, qty]) => sum + qty, 0);
      const subtotal = entries.reduce((sum, [id, qty]) => sum + menu.find(item => item.id === id).price * qty, 0);
      document.getElementById('cartCount').textContent = count;
      document.getElementById('subtotal').textContent = `${subtotal} ج.م`;
      document.getElementById('delivery').textContent = subtotal ? '20 ج.م' : '-';
      document.getElementById('total').textContent = `${subtotal ? subtotal + 20 : 0} ج.م`;
      document.getElementById('cartItems').innerHTML = entries.length ? entries.map(([id, qty]) => {
        const item = menu.find(product => product.id === id);
        return `<div class="cart-item"><div class="cart-item-icon">${item.icon}</div><div><strong>${item.name}</strong><small>${qty} × ${item.price} ج.م</small></div><b>${item.price * qty} ج.م</b></div>`;
      }).join('') : '<div class="cart-empty">السلة لسه فاضية<br>اختار حاجة تحبها</div>';
    }
    function setCart(open) {
      cartDrawer.classList.toggle('open', open);
      scrim.classList.toggle('open', open);
    }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 1800);
    }
    document.getElementById('categories').addEventListener('click', event => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      document.querySelectorAll('.category').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      renderMenu(button.dataset.category);
    });
    document.getElementById('openCart').addEventListener('click', () => setCart(true));
    document.getElementById('closeCart').addEventListener('click', () => setCart(false));
    scrim.addEventListener('click', () => setCart(false));
    document.getElementById('checkout').addEventListener('click', () => {
      if (!cart.size) return showToast('اختار حاجة الأول');
      showToast('في النسخة الكاملة هنا هنكمل العنوان والدفع');
    });
    renderMenu();
    renderCart();
  </script>
</body>
</html>
